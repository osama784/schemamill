packages:
  - packages/*

# Shared versions. Packages reference these with the "catalog:" protocol.
catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^24.13.6
  eslint: ^10.11.0
  eslint-config-prettier: ^10.1.8
  prettier: ^3.9.8
  typescript: ~6.0.3
  typescript-eslint: ^8.70.1
  vite: ^8.3.0
  vitest: ^5.0.1

# Load-bearing: without these exceptions pnpm's minimumReleaseAge policy rejects the pinned versions.
minimumReleaseAgeExclude:
  - '@nestjs/common@12.0.4'
  - '@nestjs/core@12.0.4'
  - '@nestjs/platform-express@12.0.4'
  - '@nestjs/testing@12.0.4'
  - '@typescript-eslint/eslint-plugin@8.70.1'
  - '@typescript-eslint/parser@8.70.1'
  - '@typescript-eslint/project-service@8.70.1'
  - '@typescript-eslint/scope-manager@8.70.1'
  - '@typescript-eslint/tsconfig-utils@8.70.1'
  - '@typescript-eslint/type-utils@8.70.1'
  - '@typescript-eslint/types@8.70.1'
  - '@typescript-eslint/typescript-estree@8.70.1'
  - '@typescript-eslint/utils@8.70.1'
  - '@typescript-eslint/visitor-keys@8.70.1'
  - typescript-eslint@8.70.1
