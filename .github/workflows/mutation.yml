name: Mutation

# A pull_request run starts with the PR that adds this workflow. The cron schedule and the
# workflow_dispatch trigger only arm once this file reaches the default branch (main).
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'packages/core/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mutation.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # The mutation harness is deliberately not part of the required `verify` matrix: it runs on a
  # 60-minute budget, path-filtered and scheduled, and publishes its report as an artifact.
  mutation:
    name: mutation (core)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pnpm version comes from the "packageManager" field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Scoped mutation sanity check
        run: pnpm mutation:check

      - name: Full mutation run
        run: pnpm mutation:core

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: packages/core/reports/
          if-no-files-found: error
          retention-days: 14
